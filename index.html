<meta property="og:title" content="Aira Mel, AI Builder">
<meta property="og:description" content="I don't just explore what AI can do. I build things with it.">

<style>
/* VOICE occasion: a personal site with the warmth of her Pinterest, film photos, nights out, a Ferrari red helmet
   IDEA a photo-booth strip and a film contact sheet; her path and her projects as frames she shot herself
   PICTURE a tilted four-frame photo-booth strip: Pereiro, Fortaleza, São Paulo, Inteli, flashing in on load
   COLOUR Ferrari red field, warm paper ground, navy ink, watermelon, sky blue and orange per project
   TYPE Instrument Serif for display, DM Sans for text, Caveat for handwritten margin notes
   LAYOUT hero red band with name left and strip right; on phone name, strip as 2x2, buttons */
:root{color-scheme:light dark;
--bg:light-dark(#fffaf4,#0e1531);--ink:light-dark(#14204a,#f6efe6);--soft:light-dark(#5b6385,#b9bfd6);
--card:light-dark(#ffffff,#16204a);--line:light-dark(#e8dfd3,#2a376b);
--red:#d4161c;--melon:#ff5a6e;--sky:#3f86e0;--orange:#ff7a1a;--navy:#14204a;--paper:#fffaf4}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "DM Sans",system-ui,sans-serif;overflow-x:clip}
img,svg{max-width:100%}
a{color:inherit}
.band{padding-block:clamp(48px,7vw,104px);padding-inline:max(5vw,16px)}
.wrap{max-width:1240px;margin-inline:auto}
h1,h2,h3{font-family:"Instrument Serif",Georgia,serif;font-weight:400;line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:clamp(40px,5.5vw,64px)}
h3{font-size:clamp(30px,3.4vw,42px)}
p{margin:0 0 1em}
.note{font-family:Caveat,cursive;font-size:24px;line-height:1.15;color:var(--melon)}
mark.todo{background:transparent;color:inherit;border:1.5px dashed var(--melon);border-radius:6px;padding:0 6px;font-style:italic}
mark.todo::before{content:"✎ ";color:var(--melon);font-style:normal}
body.clean mark.todo,body.clean .draft{display:none}

.draft{background:var(--navy);color:#fff;font-size:14px;padding:10px max(5vw,16px);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.draft button{font:inherit;font-size:14px;background:#fff;color:var(--navy);border:0;border-radius:999px;padding:8px 14px;cursor:pointer;min-height:36px}

nav{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:8px 24px;flex-wrap:wrap;padding:12px max(5vw,16px);max-width:none}
.brand{font-family:"Instrument Serif",serif;font-size:26px;text-decoration:none;margin-right:auto}
.brand span{color:var(--red)}
.links{display:flex;gap:4px 18px;flex-wrap:wrap}
.links a{text-decoration:none;font-weight:500;font-size:15px;padding:6px 0;border-bottom:2px solid transparent}
.links a:hover,.links a:focus-visible{border-color:var(--red)}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:14px;font-weight:700;background:transparent;color:var(--ink);border:0;padding:6px 12px;cursor:pointer;min-height:36px}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
button:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:3px}

.hero{background:var(--red);color:#fff8f0;position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.75fr);gap:clamp(32px,5vw,72px);align-items:center}
.hero h1{font-size:clamp(76px,12vw,172px);line-height:.88;letter-spacing:-.035em}
.role{font-weight:700;font-size:clamp(16px,1.6vw,19px);margin:22px 0 26px;letter-spacing:.01em}
.quote{font-family:"Instrument Serif",serif;font-size:clamp(26px,3vw,38px);line-height:1.12;max-width:20ch;margin-bottom:18px}
.quote em{color:var(--paper);background:linear-gradient(transparent 62%,rgba(255,90,110,.75) 62%)}
.hero .sub{max-width:46ch;opacity:.93;font-size:17px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid #fff8f0;transition:transform .2s}
.btn.solid{background:#fff8f0;color:var(--red)}
.btn:hover{transform:translateY(-2px)}
.strip{background:#fffdf8;padding:12px 12px 40px;display:grid;gap:10px;transform:rotate(3deg);box-shadow:14px 16px 0 rgba(60,0,0,.28);max-width:270px;justify-self:center;position:relative}
.strip::after{content:"Aira · 2026";position:absolute;bottom:8px;left:0;right:0;text-align:center;font-family:Caveat,cursive;font-size:22px;color:var(--navy)}
.frame{position:relative;aspect-ratio:10/7;overflow:hidden;background:#ddd}
.frame svg{display:block;width:100%;height:100%}
.frame span{position:absolute;left:8px;bottom:4px;font-family:Caveat,cursive;font-size:20px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.frame::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;animation:flash 1.1s ease-out both}
.frame:nth-child(1)::after{animation-delay:.2s}.frame:nth-child(2)::after{animation-delay:.7s}.frame:nth-child(3)::after{animation-delay:1.2s}.frame:nth-child(4)::after{animation-delay:1.7s}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.frame::after{animation:none}.btn{transition:none}html{scroll-behavior:auto}}

.about{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(32px,5vw,80px)}
.about p{font-size:18px;max-width:60ch}
.about .note{margin-top:8px;transform:rotate(-2deg);display:inline-block}
.me{background:var(--card);border:1px solid var(--line);padding:24px;transform:rotate(1.2deg);box-shadow:8px 10px 0 color-mix(in srgb,var(--red) 22%,transparent)}
.me h3{font-size:30px;margin-bottom:10px}
.me p{font-size:16px}
.path{list-style:none;margin:0;padding:0;border-left:3px solid var(--red)}
.path li{padding:0 0 22px 22px;position:relative}
.path li::before{content:"";position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:3px solid var(--red)}
.path b{display:block;font-family:"Instrument Serif",serif;font-weight:400;font-size:26px;line-height:1.1}
.path small{font-size:15px;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:500}

.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 32px;margin-bottom:clamp(28px,4vw,48px)}
.head p{max-width:46ch;color:var(--soft);margin:0}
.proj{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);background:var(--card);border:1px solid var(--line);margin-bottom:28px;border-radius:4px;overflow:hidden}
.proj:nth-of-type(even){grid-template-columns:minmax(0,1.4fr) minmax(0,.85fr)}
.proj:nth-of-type(even) .cover{order:2}
.cover{background:var(--c);color:#fff;padding:clamp(24px,3vw,40px);display:flex;flex-direction:column;gap:14px;position:relative;min-height:320px}
.cover .who{font-weight:700;font-size:15px;opacity:.9}
.cover h3{font-size:clamp(40px,4.6vw,60px)}
.cover p{font-family:"Instrument Serif",serif;font-size:22px;line-height:1.2;margin:0}
.cover .tags{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}
.cover .tags span{background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:500}
.sprock{position:absolute;top:0;bottom:0;right:10px;width:10px;background:radial-gradient(circle,rgba(255,255,255,.35) 3px,transparent 3.5px) 0 0/10px 18px}
.proj:nth-of-type(even) .sprock{right:auto;left:10px}
.body{padding:clamp(24px,3vw,40px);display:grid;gap:20px;align-content:start}
.story{font-family:"Instrument Serif",serif;font-size:clamp(22px,2.2vw,27px);line-height:1.22;margin:0}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.trio dt{font-weight:700;font-size:14px;color:var(--red);margin-bottom:4px}
.trio dd{margin:0;font-size:15px}
.trio .mine{background:color-mix(in srgb,var(--c) 11%,transparent);border-left:4px solid var(--c);padding:10px 12px}
.toolsl{font-size:14px;color:var(--soft);margin:0}
.toolsl a{color:var(--red);font-weight:700}
.kind{display:inline-block;align-self:flex-start;background:#fff8f0;color:var(--navy);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.thumbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.thumb{background:var(--card);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:6px;border-top:6px solid var(--t)}
.thumb b{font-family:"Instrument Serif",serif;font-weight:400;font-size:26px;line-height:1.05}
.thumb small{color:var(--soft);font-size:13px;font-weight:700}
.thumb p{margin:0;font-size:14.5px}
.liga{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);background:var(--navy);color:#f6efe6;margin-bottom:36px}
.liga .lc{background:var(--sky);padding:clamp(24px,3vw,40px);display:flex;flex-direction:column;gap:12px;justify-content:space-between}
.liga .lc h3{font-size:clamp(40px,4.4vw,58px);color:#fff}
.liga .lb{padding:clamp(24px,3vw,40px)}
.liga .lb p{font-size:16px}
.glink{color:#fff;font-weight:700;text-decoration-color:var(--melon);text-underline-offset:4px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 28px;padding:clamp(24px,3vw,40px);margin:0}
.fields div{margin:0}
.fields dt{font-weight:700;font-size:14px;color:var(--c2,var(--red));margin-bottom:4px}
.fields dd{margin:0;font-size:15.5px}
.fields .mine{grid-column:1/-1;background:color-mix(in srgb,var(--c) 10%,transparent);border-left:4px solid var(--c);padding:14px 16px}
.more{margin-top:48px}
.more h3{margin-bottom:12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:6px 28px;padding:18px 0;border-top:1px solid var(--line)}
.row b{font-family:"Instrument Serif",serif;font-weight:400;font-size:26px;line-height:1.1}
.row small{display:block;color:var(--soft);font-size:14px}
.row p{margin:0}

.build{background:var(--navy);color:#f6efe6}
.build .head p{color:#c3c9df}
.film{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;background:#0a1230;padding:22px 0;position:relative}
.film::before,.film::after{content:"";position:absolute;left:0;right:0;height:10px;background:radial-gradient(circle,#2b3a74 3.5px,transparent 4px) 0 0/22px 10px}
.film::before{top:6px}.film::after{bottom:6px}
.shot{background:var(--paper);color:var(--navy);margin:0 6px;padding:20px 18px;display:flex;flex-direction:column;gap:10px}
.shot h3{font-size:26px}
.shot p{font-size:15px;margin:0}
.shot .note{font-size:21px;margin-top:auto;color:var(--red)}
.build .aside{margin-top:22px;color:#c3c9df;max-width:70ch;font-size:15px}

.beyond{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px}
.beyond div{padding:18px 0;border-top:1px solid var(--line)}
.beyond b{display:block;font-size:17px}
.beyond span{color:var(--soft);font-size:15px}
.beyond .did{margin:6px 0 0;font-size:15px}

.contact{background:var(--red);color:#fff8f0}
.contact h2{font-size:clamp(48px,8vw,112px);max-width:12ch}
.contact .wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:32px;align-items:end}
.clinks{display:grid;gap:10px}
.clinks a{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:2px solid rgba(255,248,240,.5);padding:10px 0;text-decoration:none;font-size:19px;font-weight:500}
.clinks a:hover{border-color:#fff8f0}
.clinks small{font-size:14px;opacity:.85;overflow-wrap:anywhere;text-align:right}
footer{padding:22px max(5vw,16px);font-size:14px;color:var(--soft);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}

@media(max-width:900px){
.film{grid-template-columns:repeat(5,minmax(220px,1fr));overflow-x:auto}
.proj,.proj:nth-of-type(even){grid-template-columns:minmax(0,1fr)}
.proj:nth-of-type(even) .cover{order:0}
.cover{min-height:0}
}
@media(max-width:700px){
.trio,.liga{grid-template-columns:minmax(0,1fr)}
.hero .wrap,.about,.contact .wrap{grid-template-columns:minmax(0,1fr)}
.strip{grid-template-columns:repeat(2,minmax(0,1fr));max-width:420px;width:100%;transform:rotate(1.5deg)}
.fields,.beyond{grid-template-columns:minmax(0,1fr)}
.row{grid-template-columns:minmax(0,1fr)}
.links{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap}
.links a{flex:none}
}
</style>
</head>

/* São Paulo skyline, generated */
(function(){
  const sp = $("sp"); let seed = 7, out = "";
  const rnd = () => (seed = seed*16807 % 2147483647) / 2147483647;
  let x = 0;
  while(x < 200){
    const w = 16 + rnd()*18, h = 40 + rnd()*70, y = 140 - h;
    out += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${rnd()>.5?'#22346e':'#1b2a5c'}"/>`;
    for(let wy = y+6; wy < 134; wy += 9) for(let wx = x+4; wx < x+w-4; wx += 7)
      if(rnd() > .55) out += `<rect x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="3" height="4" fill="#ffcf6b"/>`;
    x += w + 2;
  }
  sp.insertAdjacentHTML("beforeend", out);
})();
